<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraGuessr — Abschlusspräsentation SWE Kurs B 2026</title>
    <meta name="description" content="Abschlusspräsentation des Software-Engineering-Projekts TerraGuessr (Kurs B 2026, Gruppe D).">
    <meta name="theme-color" content="#0f1021">

    <link rel="stylesheet" href="./style/index.styl">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

    <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" loading="lazy" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TerraGuessr" />
    <link rel="manifest" href="/favicons/site.webmanifest" />

    <link rel="preload" href="/respawns/respawnsReferences-compressed.glb" as="fetch" crossorigin>
    <link rel="preload" href="/palette.ktx" as="fetch" crossorigin>
</head>
<body>

    <div class="game">

        <canvas class="js-canvas"></canvas>

        <!-- Map trigger -->
        <button class="js-map-trigger map-trigger">
            <div class="button-inner">
                <div class="icon-container">
                    <img class="map-icon" src="ui/map.svg" loading="lazy">
                </div>
            </div>
        </button>

    </div>

    <!-- Modals -->
    <div class="js-modals modals">

        <!-- Map -->
        <div class="js-modal modal map" data-name="map">

            <button class="js-close close">
                <div class="button-inner">
                    <div class="icon-container">
                        <img class="icon is-default" src="ui/close.svg" loading="lazy">
                    </div>
                </div>
            </button>

            <div class="js-map-container map-container">
                <img class="js-texture texture" loading="lazy">
                <div class="js-player player"></div>
            </div>
        </div>

    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
